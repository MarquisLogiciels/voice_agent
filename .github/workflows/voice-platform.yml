name: voice-platform

on:
  push:
    paths: ["voice-platform/**", "livekit-agents/**", ".github/workflows/voice-platform.yml"]
  pull_request:
    paths: ["voice-platform/**", "livekit-agents/**", ".github/workflows/voice-platform.yml"]

permissions:
  contents: read

concurrency:
  group: voice-platform-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: voice-platform

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {lfs: true}
      - uses: astral-sh/setup-uv@v3
      - run: uv sync --frozen
      - run: uv run ruff check src tests
      - run: uv run ruff format --check src tests
      - run: uv run lint-imports
      - run: uv run mypy

  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_PASSWORD: postgres}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-retries 20
    env:
      VP_TEST_PG_OWNER_URL: postgresql+asyncpg://vp_owner:vp_test_password@localhost:5432/voice_platform
      VP_TEST_PG_APP_URL: postgresql+asyncpg://vp_app:vp_test_password@localhost:5432/voice_platform
    steps:
      - uses: actions/checkout@v4
        with: {lfs: true}
      - uses: astral-sh/setup-uv@v3
      - name: Prepare database roles
        env: {PGPASSWORD: postgres}
        run: |
          psql -h localhost -U postgres -c "create role vp_owner login password 'vp_test_password'"
          psql -h localhost -U postgres -c "create role vp_app login password 'vp_test_password' nosuperuser nobypassrls"
          psql -h localhost -U postgres -c "create database voice_platform owner vp_owner"
          psql -h localhost -U postgres -d voice_platform -c "create extension vector; create extension unaccent; create extension pgcrypto; alter schema public owner to vp_owner"
      - run: uv sync --frozen
      - run: npx -y playwright@1.48.2 install --with-deps chromium
      - run: uv run pytest -q --junitxml=../test-results.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: voice-platform-test-results, path: test-results.xml}

  image:
    runs-on: ubuntu-latest
    needs: [quality, tests]
    defaults: {run: {working-directory: .}}
    steps:
      - uses: actions/checkout@v4
        with: {lfs: true}
      - run: docker build -f voice-platform/infrastructure/docker/Dockerfile -t voice-platform:ci .
