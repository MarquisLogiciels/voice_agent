groups:
  - name: voice-platform
    rules:
      - alert: ResponseLatencyHigh
        expr: histogram_quantile(0.95, sum by (le) (rate(vp_response_latency_seconds_bucket[10m]))) > 1.5
        for: 10m
        labels: {severity: warning}
        annotations: {summary: "p95 user→agent response latency above 1.5s"}
      - alert: ProviderFailing
        expr: sum by (kind, provider) (rate(vp_provider_errors_total{recoverable="false"}[5m])) > 0.05
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "{{ $labels.kind }} provider {{ $labels.provider }} failing"}
      - alert: ToolFailureRateHigh
        expr: sum(rate(vp_tool_calls_total{status="error"}[15m])) / clamp_min(sum(rate(vp_tool_calls_total[15m])), 1e-9) > 0.2
        for: 15m
        labels: {severity: warning}
        annotations: {summary: "More than 20% of tool calls failing"}
      - alert: TransfersFailing
        expr: sum(rate(vp_transfers_total{outcome!~"completed|dry_run"}[30m])) > 0 and sum(rate(vp_transfers_total{outcome="completed"}[30m])) == 0
        for: 30m
        labels: {severity: critical}
        annotations: {summary: "Human transfers are failing"}
      - alert: ApiErrors
        expr: sum(rate(vp_api_requests_total{status=~"5.."}[5m])) > 0.1
        for: 5m
        labels: {severity: critical}
        annotations: {summary: "API returning 5xx"}
      - alert: JobsDead
        expr: increase(vp_jobs_total{status="dead"}[1h]) > 0
        labels: {severity: warning}
        annotations: {summary: "Background jobs exhausted their retries"}
