# Local development stack. NOT for production (dev passwords, LiveKit in --dev mode).
#   docker compose -f voice-platform/infrastructure/docker-compose.yml up --build
name: voice-platform
x-app: &app
  build: {context: ../.., dockerfile: voice-platform/infrastructure/docker/Dockerfile}
  env_file: [../.env]
  environment: &appenv
    VP_ENVIRONMENT: dev
    VP_DATABASE_URL: postgresql+asyncpg://vp_app:vp_app_dev_password@postgres:5432/voice_platform
    VP_MIGRATION_DATABASE_URL: postgresql+asyncpg://vp_owner:vp_owner_dev_password@postgres:5432/voice_platform
    VP_REDIS_URL: redis://redis:6379/0
    VP_BLOB_BACKEND: s3
    VP_S3_BUCKET: voice-platform
    VP_S3_ENDPOINT_URL: http://minio:9000
    VP_S3_ACCESS_KEY_ID: minioadmin
    VP_S3_SECRET_ACCESS_KEY: minioadmin
    VP_LIVEKIT_URL: ws://livekit:7880
    VP_LIVEKIT_API_KEY: devkey
    VP_LIVEKIT_API_SECRET: secretsecretsecretsecretsecretsecret
    LIVEKIT_URL: ws://livekit:7880
    LIVEKIT_API_KEY: devkey
    LIVEKIT_API_SECRET: secretsecretsecretsecretsecretsecret
    VP_OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
    VP_TELEPHONY_DRY_RUN: "true"
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_started}
  restart: unless-stopped

services:
  postgres:
    image: pgvector/pgvector:pg16
    environment: {POSTGRES_PASSWORD: postgres}
    volumes: [pgdata:/var/lib/postgresql/data, ./docker/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro]
    ports: ["5432:5432"]
    healthcheck: {test: ["CMD", "pg_isready", "-U", "postgres", "-d", "voice_platform"], interval: 5s, retries: 20}
  redis:
    image: redis:7-alpine
    command: ["redis-server", "--save", "", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
  minio:
    image: minio/minio:RELEASE.2024-10-13T13-34-11Z
    command: server /data --console-address :9001
    ports: ["9000:9000", "9001:9001"]
    volumes: [minio:/data]
  minio-init:
    image: minio/mc:RELEASE.2024-10-08T09-37-26Z
    depends_on: [minio]
    entrypoint: ["/bin/sh", "-c", "mc alias set local http://minio:9000 minioadmin minioadmin && mc mb -p local/voice-platform && mc encrypt set sse-s3 local/voice-platform || true"]
  livekit:
    image: livekit/livekit-server:v1.8
    command: ["--dev", "--bind", "0.0.0.0"]
    ports: ["7880:7880", "7881:7881", "7882:7882/udp"]
  migrate:
    <<: *app
    command: ["vp", "migrate"]
    restart: "no"
  api:
    <<: *app
    command: ["vp-api"]
    ports: ["8000:8000"]
    depends_on: {migrate: {condition: service_completed_successfully}, redis: {condition: service_started}}
  worker:
    <<: *app
    command: ["vp-worker", "start"]
    ports: ["9464:9464"]
    depends_on: {migrate: {condition: service_completed_successfully}, livekit: {condition: service_started}}
    deploy: {resources: {limits: {cpus: "2", memory: 3g}}}
    # the image HEALTHCHECK probes the API; the worker's health server is LiveKit's on :8081
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8081/').status==200 else 1)"]
      interval: 15s
      start_period: 60s
    # calls are drained on SIGTERM (drain_timeout 1800 s); give them time to finish
    stop_grace_period: 30m
  jobs:
    <<: *app
    command: ["vp", "jobs"]
    healthcheck: {disable: true}
    depends_on: {migrate: {condition: service_completed_successfully}}
    stop_grace_period: 120s
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.111.0
    command: ["--config=/etc/otel.yaml"]
    volumes: [./monitoring/otel-collector.yaml:/etc/otel.yaml:ro]
  jaeger:
    image: jaegertracing/all-in-one:1.62.0
    ports: ["16686:16686"]
  prometheus:
    image: prom/prometheus:v2.55.0
    volumes: [./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro, ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro]
    ports: ["9090:9090"]
  grafana:
    image: grafana/grafana:11.3.0
    environment: {GF_AUTH_ANONYMOUS_ENABLED: "true", GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer}
    volumes: [./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro, ./monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro]
    ports: ["3000:3000"]
volumes: {pgdata: {}, minio: {}}
